#
# Build the DuckDB BigQuery extension for DuckDB 1.4.4.
# Produces GitHub Actions extension artifacts only; no deployment, BigQuery integration tests, or NuGet packaging.
#
name: DuckDB 1.4.4 Extension Build
on:
    push:
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    code-quality-check:
        name: Code Quality Check
        uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.4.4
        with:
            duckdb_version: v1.4.4
            ci_tools_version: v1.4.4
            extension_name: bigquery
            format_checks: "format"

    duckdb-stable-build:
        name: Build Windows extension binary
        if: |
            github.event_name == 'pull_request' ||
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'push' && github.ref_name == 'duckdb_v1.4.4')
        # Reuse the newer CI orchestration from main. It explicitly selects MSVC
        # for windows_amd64 and supports both the VS18 and VS2022 vcvars paths.
        # The extension itself is still built against DuckDB/CI tools v1.4.4.
        uses: sashapodgoreanu/duckdb-bigquery/.github/workflows/_extension_distribution.yml@main
        secrets: inherit
        with:
            extension_name: bigquery
            duckdb_version: v1.4.4
            ci_tools_version: v1.4.4
            exclude_archs: "linux_amd64;linux_arm64;linux_amd64_musl;osx_amd64;osx_arm64;wasm_mvp;wasm_eh;wasm_threads;windows_arm64;windows_amd64_mingw;"
            vcpkg_commit: "ef7dbf94b9198bc58f45951adcf1f041fcbc5ea0"
            extra_toolchains: "parser_tools"
            skip_tests: true
            save_cache: false
            reduced_ci_mode: "disabled"
